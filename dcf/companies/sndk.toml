# Sandisk (SNDK) settings for DCF mk9
# REVIEWED 2026-11-11. Reasoning and sources in dcf/DECISIONS.md.
#
# Every line is tagged:
#   DATA        taken from the company's filings, guidance or price history.
#   MARKET      market-wide input, same for every company.
#   ASSUMPTION  a judgment. These move the answer; challenge them.
#   SETTING     how the model runs.
#
# Revenue is in $bn; rates are decimals (0.05 = 5%). Year 1 = the next 12 months.

ticker = "SNDK"
auto_generated = false         # SETTING: reviewed by hand, so "rebuild" will not overwrite it
horizon_years = 10             # SETTING: years forecast before the terminal value
midyear = true                 # SETTING: cash flows arrive mid-year on average
primary_tv = "gordon"          # SETTING: "gordon" or "exit"; the other is shown as a cross-check
fx_to_price_currency = 1.0     # SETTING: reporting currency -> trading currency (USD/USD = 1)

[capital]
risk_free = 0.0498             # MARKET: US 10-year Treasury par yield, Nov 10 2026
equity_risk_premium = 0.0441   # MARKET: Damodaran implied ERP, Nov 1 2026 (trailing 12 month, adjusted payout)
beta = 2.0                     # DATA: peer beta (peer_beta.py), median unlevered 2.51, relevered 2.52, Blume-adjusted 2.01
pre_tax_cost_of_debt = 0.05    # ASSUMPTION: not reviewed; SNDK has no borrowed debt, only matters for leases
tax_rate = 0.15                # DATA: Q1 FY27 GAAP rate 13.1%, Q2 non-GAAP guide 14.3%, rounded up

[shares]
# SEC share counts are pre-split until the next 10-Q (Feb 2027).
# Set to 8 once the price you use is post-split (trading from Nov 20, 2026). Keep at 1 before.
sec_share_multiplier = 1       # SETTING

[overrides]
price = 0                      # SETTING: 0 = live price; fill in to replace it, e.g. price = 930

# ---------------------------------------------------------------------------------
# Scenarios. revenue_bn = explicit revenue for the first years, then growth_after.
# ebit_margin_early = explicit GAAP EBIT margins, then a straight-line fade to
# ebit_margin_terminal, reached in terminal_margin_year.
#
# Anchors: FY26 revenue $20.2bn; Q1 FY27 $11.0bn at 79.6% GAAP operating margin;
# Q2 FY27 guide $12.2-12.6bn. Cost base (cost of sales + operating expenses) is
# about $9bn a year at the Q1 run rate, so early margins = 1 - cost / revenue.
# Last downturn: Western Digital flash revenue -38% in one year (FY22 to FY23).
#
# Reinvestment: Sandisk's own PP&E spend is small (fabs sit in the Flash Ventures
# JV). Q1 FY27: PP&E $54M (0.5% of revenue), cash paid into the JV $148M (1.3%),
# D&A $43M (0.4%). JV tool depreciation is already inside cost of sales.
# ---------------------------------------------------------------------------------

[scenarios.bear]
# Prices fall back to about pre-boom levels by year 3 as 2027-28 supply arrives.
probability = 0.25                              # ASSUMPTION
revenue_bn = [42, 22, 13]                       # ASSUMPTION
growth_after = [0.15, 0.10, 0.06, 0.05, 0.04]   # ASSUMPTION: recovery off the trough, then slow growth
ebit_margin_early = [0.77, 0.52, 0.13]          # ASSUMPTION: 1 - cost/revenue, cost about $9.7bn, $10.5bn, $11.3bn
ebit_margin_terminal = 0.20                     # ASSUMPTION: a normal year looks like the best pre-AI years
terminal_margin_year = 6                        # ASSUMPTION
capex_pct_revenue = 0.01                        # ASSUMPTION
jv_capex_pct_revenue = 0.06                     # ASSUMPTION: JV spending falls in dollars but rises as a share of lower revenue
da_pct_revenue = 0.01                           # ASSUMPTION
nwc_pct_revenue = 0.10                          # ASSUMPTION: not reviewed
terminal_growth = 0.025                         # ASSUMPTION
terminal_roic = 0.14                            # ASSUMPTION: about equal to WACC, so growth adds no value
exit_multiple = 6.0                             # ASSUMPTION: below Micron's 10-year median EV/EBITDA of 7.0x

[scenarios.base]
# Supply and demand balance in 2H 2027 (TrendForce); prices fall about half from the
# peak by year 3, as in 2021-23, then settle well above pre-boom levels.
probability = 0.50                              # ASSUMPTION
revenue_bn = [50, 42, 32]                       # ASSUMPTION
growth_after = [0.00, 0.03, 0.05, 0.05, 0.04]   # ASSUMPTION
ebit_margin_early = [0.79, 0.74, 0.62]          # ASSUMPTION
ebit_margin_terminal = 0.35                     # ASSUMPTION: better than pre-AI (data center mix, contracts), far below today
terminal_margin_year = 7                        # ASSUMPTION
capex_pct_revenue = 0.005                       # DATA then ASSUMPTION: Q1 FY27 PP&E 0.5% of revenue
jv_capex_pct_revenue = 0.04                     # ASSUMPTION
da_pct_revenue = 0.005                          # DATA then ASSUMPTION: Q1 FY27 D&A 0.4% of revenue
nwc_pct_revenue = 0.10                          # ASSUMPTION
terminal_growth = 0.03                          # ASSUMPTION
terminal_roic = 0.18                            # ASSUMPTION
exit_multiple = 7.0                             # ASSUMPTION: Micron's 10-year median EV/EBITDA

[scenarios.bull]
# AI storage demand absorbs the new supply; contracts hold prices near current levels.
probability = 0.25                              # ASSUMPTION
revenue_bn = [54, 60, 62]                       # ASSUMPTION
growth_after = [0.06, 0.06, 0.05, 0.04]         # ASSUMPTION
ebit_margin_early = [0.80, 0.79, 0.75]          # ASSUMPTION
ebit_margin_terminal = 0.50                     # ASSUMPTION: below management's ~80% gross margin view for FY28-30
terminal_margin_year = 8                        # ASSUMPTION
capex_pct_revenue = 0.005                       # ASSUMPTION
jv_capex_pct_revenue = 0.03                     # ASSUMPTION
da_pct_revenue = 0.005                          # ASSUMPTION
nwc_pct_revenue = 0.10                          # ASSUMPTION
terminal_growth = 0.035                         # ASSUMPTION
terminal_roic = 0.25                            # ASSUMPTION
exit_multiple = 9.0                             # ASSUMPTION

# Sources (details in dcf/DECISIONS.md):
#   Sandisk Q4 FY26 and Q1 FY27 results releases and slides; Q1 FY27 8-K Ex.99.1, Oct 29 2026
#   Western Digital FY23 results (last flash downturn)
#   TrendForce, Jul 30 2026 (NAND supply outlook)
#   GuruFocus (Micron 10-year EV/EBITDA)
#   US Treasury par yield curve, Nov 10 2026; Damodaran implied ERP, Nov 1 2026
